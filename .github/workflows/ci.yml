# Linux CI (CU-003): lint, type check, unit, integration and E2E tests with Google Chrome,
# and the AC coverage check (CU-284). REQ-079 is checked in two places: the unit tests check
# the dependency list of apps/server and the security headers, the E2E suite starts the
# server in its test mode and fails on any outbound connection to another destination than
# 127.0.0.1 and on any browser request to another host.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Lint, type check, tests (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit shipped dependencies (TH-07)
        run: npm audit --omit=dev --audit-level=high

      - name: Audit all dependencies including dev tooling (TH-07)
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit and integration tests (incl. REQ-079 dependency list and security headers)
        run: npm test

      - name: AC coverage of the completed build steps (CU-284)
        run: node tools/qa/check-ac-coverage.mjs

      # Evidence of REQ-068 and REQ-069 (Technical Specification 2.20, 5): schema test over all
      # tables, audit entries without a user, error log without field values. The tests also run
      # in `npm test`; this step names the evidence and fails if no such test is found.
      - name: No credentials and no personal data (REQ-068, REQ-069)
        run: >-
          npx vitest run -t "REQ-06[89]"
          apps/server/src/db/schema.int.test.ts
          apps/server/src/audit/audit-writer.int.test.ts
          apps/server/src/ops/error-log

      # The E2E suite runs in Google Chrome (channel `chrome`, Technical Specification 6.1),
      # which the Ubuntu runner image provides; Playwright downloads no browser.
      - name: Google Chrome version
        run: google-chrome --version

      - name: E2E tests (Playwright, window-size matrix FM-1 to FM-7, REQ-079 connections)
        run: npm run e2e
